# Temporary: proves the launcher race fix on Windows. Removed before any PR.
name: launcher-race-proof
on:
  push:
    branches: [fix/launcher-thread-race]
permissions:
  contents: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: old code from main
        run: mkdir -p ../old && git archive d660b3e tokeneconomizer | tar -x -C ../old
      - name: "stress: 4 threads write the launcher at once, 300 times"
        run: |
          python -I .proof/stress.py ../old 300 "before (main)" || true
          python -I .proof/stress.py ../old 300 "main + retry only" retryonly || true
          python -I .proof/stress.py "$PWD" 300 "after, unique name only" noretry || true
          python -I .proof/stress.py "$PWD" 300 "after (the fix)"
      - name: "the CI test, 100 times, on main's code"
        run: |
          cp -r tokeneconomizer ../new
          rm -rf tokeneconomizer && cp -r ../old/tokeneconomizer tokeneconomizer
          f=0; for i in $(seq 100); do python -m pytest -q -p no:cacheprovider "tests/test_hermes_plugin.py::test_gateway_and_cron_sessions_in_two_repositories_fold_apart_through_the_real_dispatcher" >/dev/null 2>&1 || f=$((f+1)); done
          echo "before (main): $f/100 failed"
          rm -rf tokeneconomizer && cp -r ../new tokeneconomizer
      - name: "the CI test, 100 times, with the fix"
        run: |
          f=0; for i in $(seq 100); do python -m pytest -q -p no:cacheprovider "tests/test_hermes_plugin.py::test_gateway_and_cron_sessions_in_two_repositories_fold_apart_through_the_real_dispatcher" >/dev/null 2>&1 || f=$((f+1)); done
          echo "after (the fix): $f/100 failed"; test "$f" = 0
      - name: new regression test and launcher tests
        run: python -m pytest -q -p no:cacheprovider tests/test_windows_launcher.py tests/test_hermes_plugin.py
